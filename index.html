<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>THE GATE OF PROVADIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #C9A227;
            --gold-pale: #FFEFC1;
            --gold-deep: #6B4A12;
            --gold-dark: #3D2A08;
            --salt: #F4EFE6;
            --bg: #141210;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
        }
        #vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(20, 18, 16, 0.85) 100%);
            mix-blend-mode: multiply;
        }
        #fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 20;
            pointer-events: none;
            animation: fadeOut 2.6s ease forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        .overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .overlay.visible {
            opacity: 1;
        }
        #title-overlay {
            top: 4%;
            left: 0;
            width: 100%;
            text-align: center;
            font-family: 'Cinzel', serif;
            color: var(--gold-pale);
            letter-spacing: 0.4em;
            font-weight: 600;
        }
        #title-overlay .main-title {
            font-size: clamp(1.8rem, 6vw, 3.8rem);
            text-shadow: 0 0 20px rgba(201, 162, 39, 0.5), 0 0 50px rgba(201, 162, 39, 0.2);
            line-height: 1.2;
        }
        #title-overlay .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.65rem, 2vw, 1rem);
            letter-spacing: 0.25em;
            color: var(--gold);
            margin-top: 0.5rem;
            text-transform: uppercase;
            font-weight: 400;
            text-shadow: 0 0 10px rgba(201, 162, 39, 0.3);
        }
        #bottom-left {
            bottom: 3.5%;
            left: 3%;
            text-align: left;
        }
        #bottom-left .wall-title {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: clamp(1rem, 3vw, 1.6rem);
            letter-spacing: 0.15em;
            margin-bottom: 0.2rem;
        }
        #bottom-left .counter {
            color: rgba(244, 239, 230, 0.75);
            font-size: clamp(0.7rem, 1.8vw, 0.9rem);
            letter-spacing: 0.08em;
            font-weight: 300;
        }
        #flip-button {
            bottom: 4%;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            cursor: pointer;
            background: transparent;
            border: 1.5px solid var(--gold);
            color: var(--gold-pale);
            font-family: 'Cinzel', serif;
            letter-spacing: 0.2em;
            font-size: clamp(0.8rem, 2vw, 1rem);
            padding: 0.7rem 1.8rem;
            border-radius: 2rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            background: rgba(20, 18, 16, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        #flip-button:hover {
            background: rgba(201, 162, 39, 0.15);
            box-shadow: 0 0 20px rgba(201, 162, 39, 0.3);
        }
        #bottom-right {
            bottom: 3.5%;
            right: 3%;
            text-align: right;
            color: rgba(244, 239, 230, 0.7);
            font-size: clamp(0.7rem, 1.8vw, 0.9rem);
            letter-spacing: 0.08em;
            font-weight: 300;
        }
        @media (max-width: 600px) {
            #title-overlay .subtitle {
                letter-spacing: 0.15em;
            }
            #flip-button {
                padding: 0.5rem 1.2rem;
                letter-spacing: 0.12em;
            }
        }
    </style>
</head>
<body>
            <div id="vignette"></div>
    <div id="fade-overlay"></div>
    <div id="title-overlay" class="overlay">
        <div class="main-title">PROVADIA</div>
        <div class="subtitle">THE GATE · EUROPE'S FIRST TOWN OF RECORD</div>
    </div>
    <div id="bottom-left" class="overlay">
        <div class="wall-title">THE GOLDEN WALL</div>
        <div class="counter">0 / 47 bricks laid · one is waiting</div>
    </div>
    <button id="flip-button" class="overlay">FLIP THE COIN</button>
    <div id="bottom-right" class="overlay">TAP THE COIN</div>

    <script type="module">
        import * as THREE from './three.module.min.js';

        // ---------- SCENE SETUP ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x141210);
        scene.fog = new THREE.FogExp2(0x141210, 0.028);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2.5, 31);
        camera.lookAt(0, 2.35, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.appendChild(renderer.domElement);

        // ---------- LIGHTS ----------
        const keyLight = new THREE.DirectionalLight(0xffe6c0, 2.2);
        keyLight.position.set(-6, 6, 6);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        keyLight.shadow.camera.near = 1;
        keyLight.shadow.camera.far = 60;
        keyLight.shadow.camera.left = -15;
        keyLight.shadow.camera.right = 15;
        keyLight.shadow.camera.top = 15;
        keyLight.shadow.camera.bottom = -15;
        keyLight.shadow.bias = -0.0005;
        keyLight.shadow.normalBias = 0.02;
        scene.add(keyLight);

        const hemiLight = new THREE.HemisphereLight(0x3a3020, 0x141210, 0.35);
        scene.add(hemiLight);

        const emberLight = new THREE.PointLight(0xc9a227, 1.8, 8, 2);
        emberLight.position.set(0, 2.35, 1.2);
        scene.add(emberLight);

        // ---------- GROUND ----------
        const groundGeo = new THREE.CircleGeometry(15, 64);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x141210, roughness: 0.9, metalness: 0.1 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.62;
        ground.receiveShadow = true;
        scene.add(ground);

        // ---------- GATE STRUCTURE (z=7) ----------
        const gateGroup = new THREE.Group();
        gateGroup.position.set(0, 0, 7);
        scene.add(gateGroup);

        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x1a1715, roughness: 0.85, metalness: 0.15 });
        const capMat = new THREE.MeshStandardMaterial({ color: 0x241f1c, roughness: 0.8, metalness: 0.2 });
        const goldTrimMat = new THREE.MeshStandardMaterial({ color: 0xc9a227, roughness: 0.5, metalness: 0.6, emissive: new THREE.Color(0x1a1200), emissiveIntensity: 0.3 });

        function createPillar(x) {
            const pillarGroup = new THREE.Group();
            pillarGroup.position.x = x;
            
            const pillar = new THREE.Mesh(new THREE.BoxGeometry(1.5, 8.6, 1.5), stoneMat);
            pillar.position.y = 8.6 / 2 - 0.6;
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            pillarGroup.add(pillar);
            
            const cap = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.4, 1.8), capMat);
            cap.position.y = 8.6 - 0.6 + 0.2;
            cap.castShadow = true;
            cap.receiveShadow = true;
            pillarGroup.add(cap);
            
            for (let i = 0; i < 4; i++) {
                const trimGeo = new THREE.BoxGeometry(1.58, 0.06, 1.58);
                const trim = new THREE.Mesh(trimGeo, goldTrimMat);
                trim.position.y = 1.2 + i * 2.2;
                trim.castShadow = true;
                trim.receiveShadow = true;
                pillarGroup.add(trim);
            }
            return pillarGroup;
        }

        gateGroup.add(createPillar(-4.1));
        gateGroup.add(createPillar(4.1));

        const lintelGeo = new THREE.BoxGeometry(10.2, 0.6, 1.8);
        const lintel = new THREE.Mesh(lintelGeo, capMat);
        lintel.position.set(0, 8.4, 0);
        lintel.castShadow = true;
        lintel.receiveShadow = true;
        gateGroup.add(lintel);

        for (let i = 0; i < 2; i++) {
            const trim = new THREE.Mesh(new THREE.BoxGeometry(10.35, 0.08, 1.95), goldTrimMat);
            trim.position.set(0, 8.1 - i * 0.5, 0);
            trim.castShadow = true;
            trim.receiveShadow = true;
            gateGroup.add(trim);
        }

        // ---------- COIN ----------
        const coinGroup = new THREE.Group();
        coinGroup.position.set(0, 2.35, 0);
        scene.add(coinGroup);

        const coinRadius = 2;
        const coinThickness = 0.36;
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xc9a227, roughness: 0.3, metalness: 0.8, emissive: new THREE.Color(0x2a1a05), emissiveIntensity: 0.4 });
        const coinCylinder = new THREE.Mesh(new THREE.CylinderGeometry(coinRadius, coinRadius, coinThickness, 64), coinMat);
        coinCylinder.rotation.x = Math.PI / 2;
        coinCylinder.castShadow = true;
        coinCylinder.receiveShadow = true;
        coinGroup.add(coinCylinder);

        // FRONT RELIEF (+z)
        const frontReliefGroup = new THREE.Group();
        frontReliefGroup.position.z = coinThickness / 2 + 0.02;
        coinGroup.add(frontReliefGroup);

        const brickGoldMat = new THREE.MeshStandardMaterial({ color: 0xc9a227, roughness: 0.35, metalness: 0.75, emissive: new THREE.Color(0x1a0e00), emissiveIntensity: 0.3 });
        const brickPositions = [];
        for (let row = 0; row < 5; row++) {
            const yPos = row * 0.45 - 0.1;
            const count = 5;
            for (let i = 0; i < count; i++) {
                const xOffset = (i - (count - 1) / 2) * 0.65;
                brickPositions.push({ x: xOffset, y: yPos });
            }
        }
        brickPositions.forEach(pos => {
            const brick = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.22, 0.08), brickGoldMat);
            brick.position.set(pos.x, pos.y, 0.04);
            brick.castShadow = true;
            brick.receiveShadow = true;
            frontReliefGroup.add(brick);
        });

        // Merlons (7 along top arc)
        const merlonMat = new THREE.MeshStandardMaterial({ color: 0xffefc1, roughness: 0.25, metalness: 0.5, emissive: new THREE.Color(0x2a1a05), emissiveIntensity: 0.2 });
        for (let i = 0; i < 7; i++) {
            const angle = (i / 6) * Math.PI - Math.PI / 2;
            const rx = Math.cos(angle) * 1.55;
            const ry = Math.sin(angle) * 1.55;
            const merlon = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.28, 0.06), merlonMat);
            merlon.position.set(rx, ry, 0.03);
            merlon.rotation.z = angle;
            merlon.castShadow = true;
            merlon.receiveShadow = true;
            frontReliefGroup.add(merlon);
        }

        // Rim spheres: 47
        const rimSphereMat = new THREE.MeshStandardMaterial({ color: 0xffefc1, roughness: 0.2, metalness: 0.7, emissive: new THREE.Color(0x1a0e00), emissiveIntensity: 0.2 });
        for (let i = 0; i < 47; i++) {
            const angle = (i / 47) * Math.PI * 2;
            const rx = Math.cos(angle) * 1.76;
            const ry = Math.sin(angle) * 1.76;
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 12), rimSphereMat);
            sphere.position.set(rx, ry, 0.02);
            sphere.castShadow = true;
            sphere.receiveShadow = true;
            frontReliefGroup.add(sphere);
        }

        // BACK RELIEF (−z)
        const backReliefGroup = new THREE.Group();
        backReliefGroup.position.z = -coinThickness / 2 - 0.02;
        backReliefGroup.rotation.y = Math.PI;
        coinGroup.add(backReliefGroup);

        const sunDiscMat = new THREE.MeshStandardMaterial({ color: 0xffefc1, roughness: 0.2, metalness: 0.4, emissive: new THREE.Color(0x4a3200), emissiveIntensity: 0.8 });
        const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(1.1, 32), sunDiscMat);
        sunDisc.position.z = 0.01;
        sunDisc.castShadow = true;
        backReliefGroup.add(sunDisc);

        const torusMat = new THREE.MeshStandardMaterial({ color: 0xc9a227, roughness: 0.3, metalness: 0.7, emissive: new THREE.Color(0x1a0e00), emissiveIntensity: 0.3 });
        for (let i = 0; i < 3; i++) {
            const torus = new THREE.Mesh(new THREE.TorusGeometry(1.3 - i * 0.15, 0.06, 12, 48), torusMat);
            torus.position.z = 0.005;
            torus.castShadow = true;
            backReliefGroup.add(torus);
        }

        // Back beads: 47
        const beadMat = new THREE.MeshStandardMaterial({ color: 0xffefc1, roughness: 0.3, metalness: 0.5, emissive: new THREE.Color(0x1a0e00), emissiveIntensity: 0.2 });
        for (let i = 0; i < 47; i++) {
            const angle = (i / 47) * Math.PI * 2;
            const rx = Math.cos(angle) * 1.4;
            const ry = Math.sin(angle) * 1.4;
            const bead = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), beadMat);
            bead.position.set(rx, ry, 0.015);
            bead.castShadow = true;
            backReliefGroup.add(bead);
        }

        // ---------- GOLDEN WALL (z=−8.5) ----------
        const wallWidth = 27;
        const wallHeight = 10.1;
        const wallGroup = new THREE.Group();
        wallGroup.position.set(0, 0, -8.5);
        scene.add(wallGroup);

        const canvas = document.createElement('canvas');
        canvas.width = 2048;
        canvas.height = 768;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1a1713';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const gutter = 24;
        const slotWidth = (canvas.width - gutter * 13) / 12;
        const slotHeight = (canvas.height - gutter * 5) / 4;
        const outlineColor = 'rgba(201, 162, 39, 0.7)';
        const lineWidth = 12;

        for (let row = 0; row < 4; row++) {
            const cols = row === 3 ? 11 : 12;
            for (let col = 0; col < cols; col++) {
                const x = gutter + col * (slotWidth + gutter);
                const y = gutter + row * (slotHeight + gutter);
                ctx.strokeStyle = outlineColor;
                ctx.lineWidth = lineWidth;
                ctx.strokeRect(x, y, slotWidth, slotHeight);
            }
        }

        const wallTexture = new THREE.CanvasTexture(canvas);
        wallTexture.colorSpace = THREE.SRGBColorSpace;
        wallTexture.anisotropy = 4;
        const wallMat = new THREE.MeshStandardMaterial({ map: wallTexture, roughness: 0.7, metalness: 0.3, emissive: new THREE.Color(0x0a0805), emissiveIntensity: 0.2, side: THREE.DoubleSide });
        const wallPlane = new THREE.Mesh(new THREE.PlaneGeometry(wallWidth, wallHeight), wallMat);
        wallPlane.castShadow = true;
        wallPlane.receiveShadow = true;
        wallGroup.add(wallPlane);

        // Pulsing slot #1 overlay
        const pulseOverlayMat = new THREE.MeshBasicMaterial({ color: 0xffefc1, transparent: true, opacity: 0, side: THREE.DoubleSide });
        const pulseOverlay = new THREE.Mesh(new THREE.PlaneGeometry(slotWidth / (canvas.width / wallWidth), slotHeight / (canvas.height / wallHeight)), pulseOverlayMat);
        const firstX = gutter + 0 * (slotWidth + gutter);
        const firstY = gutter + 0 * (slotHeight + gutter);
        pulseOverlay.position.set(
            -wallWidth/2 + firstX / canvas.width * wallWidth,
            wallHeight/2 - firstY / canvas.height * wallHeight,
            0.06
        );
        wallGroup.add(pulseOverlay);

        const edgesGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(slotWidth / (canvas.width / wallWidth), slotHeight / (canvas.height / wallHeight)));
        const edgesLine = new THREE.LineSegments(edgesGeo, new THREE.LineBasicMaterial({ color: 0xffefc1, transparent: true, opacity: 0.7 }));
        edgesLine.position.copy(pulseOverlay.position);
        edgesLine.position.z += 0.02;
        wallGroup.add(edgesLine);

        // ---------- SALT DUST ----------
        const dustCount = 380;
        const dustGeo = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(dustCount * 3);
        for (let i = 0; i < dustCount; i++) {
            dustPositions[i * 3] = (Math.random() - 0.5) * 24;
            dustPositions[i * 3 + 1] = (Math.random() * 6) - 1.5;
            dustPositions[i * 3 + 2] = -4 + (Math.random() * 16) - 8;
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));

        const dustCanvas = document.createElement('canvas');
        dustCanvas.width = 64;
        dustCanvas.height = 64;
        const dctx = dustCanvas.getContext('2d');
        const gradient = dctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(244, 239, 230, 1)');
        gradient.addColorStop(0.4, 'rgba(244, 239, 230, 0.8)');
        gradient.addColorStop(0.7, 'rgba(244, 239, 230, 0.3)');
        gradient.addColorStop(1, 'rgba(244, 239, 230, 0)');
        dctx.fillStyle = gradient;
        dctx.fillRect(0, 0, 64, 64);
        const dustTexture = new THREE.CanvasTexture(dustCanvas);
        dustTexture.colorSpace = THREE.SRGBColorSpace;

        const dustMat = new THREE.PointsMaterial({
            map: dustTexture,
            color: 0xf4efe6,
            size: 0.25,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 0.7,
            sizeAttenuation: true
        });
        const dustPoints = new THREE.Points(dustGeo, dustMat);
        scene.add(dustPoints);

        // ---------- CAMERA FLIGHT PATH ----------
        const curvePoints = [
            new THREE.Vector3(0, 2.8, 31),
            new THREE.Vector3(0.5, 2.5, 22),
            new THREE.Vector3(-1.2, 2.2, 14),
            new THREE.Vector3(0.8, 2.4, 9.5),
            new THREE.Vector3(0, 2.0, 7.0),
            new THREE.Vector3(0, 2.25, 6.4)
        ];
        const flightCurve = new THREE.CatmullRomCurve3(curvePoints, false, 'catmullrom', 0.5);
        const flightDuration = 10.5;
        let flightStartTime = null;
        let freezeProgress = null;

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('shot')) {
            freezeProgress = Math.min(1, Math.max(0, parseFloat(urlParams.get('shot')) || 0));
        }

        const coinLookTarget = new THREE.Vector3(0, 2.35, 0);
        const tempVec = new THREE.Vector3();
        let flipProgress = null;
        let flipStartTime = null;
        const flipDuration = 1.5;
        let lastFlipRotation = 0;

        function smoothstep(t) {
            return t * t * (3 - 2 * t);
        }
        function smootherstep(t) {
            return t * t * t * (t * (t * 6 - 15) + 10);
        }

        function getFlightProgress(now) {
            if (freezeProgress !== null) return freezeProgress;
            if (flightStartTime === null) flightStartTime = now;
            const elapsed = (now - flightStartTime) / 1000;
            const raw = Math.min(1, elapsed / flightDuration);
            return smootherstep(raw);
        }

        function flipCoin() {
            if (flipProgress !== null) return;
            flipProgress = 0;
            flipStartTime = performance.now();
        }

        renderer.domElement.addEventListener('click', flipCoin);
        document.getElementById('flip-button').addEventListener('click', (e) => {
            e.stopPropagation();
            flipCoin();
        });

        // ---------- OVERLAYS VISIBILITY ----------
        const titleOverlay = document.getElementById('title-overlay');
        const bottomLeft = document.getElementById('bottom-left');
        const flipButton = document.getElementById('flip-button');
        const bottomRight = document.getElementById('bottom-right');
        let overlaysShown = false;

        function updateOverlays(progress) {
            if (progress > 0.86 && !overlaysShown) {
                overlaysShown = true;
                titleOverlay.classList.add('visible');
                bottomLeft.classList.add('visible');
                flipButton.classList.add('visible');
                bottomRight.classList.add('visible');
            }
        }

        // ---------- RENDER LOOP ----------
        let clock = new THREE.Clock();
        let swayTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const flightProgress = getFlightProgress(now);
            updateOverlays(flightProgress);

            // Camera position
            if (flightProgress < 1) {
                const point = flightCurve.getPoint(flightProgress);
                camera.position.copy(point);
                camera.lookAt(coinLookTarget);
            } else {
                const basePos = flightCurve.getPoint(1);
                swayTime += 0.003;
                const swayX = Math.sin(swayTime * 0.7) * 0.08;
                const swayY = Math.sin(swayTime * 0.5) * 0.05 + 0.02;
                camera.position.x = basePos.x + swayX;
                camera.position.y = basePos.y + swayY;
                camera.position.z = basePos.z + Math.sin(swayTime * 0.3) * 0.04;
                camera.lookAt(coinLookTarget);
            }

            // Coin idle sway/bob
            const idleTime = now * 0.001;
            const idleSway = Math.sin(idleTime * 0.8) * 0.06;
            const idleBob = Math.sin(idleTime * 1.2) * 0.04;
            coinGroup.position.y = 2.35 + idleBob;
            coinGroup.rotation.x = idleSway * 0.3;
            coinGroup.rotation.y += Math.sin(idleTime * 0.5) * 0.0005;

            // Flip animation
            if (flipProgress !== null) {
                const elapsed = (now - flipStartTime) / 1000;
                const t = Math.min(1, elapsed / flipDuration);
                const eased = smootherstep(t);
                const targetRotation = Math.PI;
                const currentFlip = eased * targetRotation;
                const deltaFlip = currentFlip - (lastFlipRotation || 0);
                coinGroup.rotation.z += deltaFlip;
                lastFlipRotation = currentFlip;
                if (t >= 1) {
                    flipProgress = null;
                    lastFlipRotation = 0;
                }
            }

            // Salt dust drift
            const dustPos = dustPoints.geometry.attributes.position.array;
            for (let i = 0; i < dustCount; i++) {
                dustPos[i * 3 + 1] += 0.0015;
                if (dustPos[i * 3 + 1] > 4.5) dustPos[i * 3 + 1] = -1.5;
            }
            dustPoints.geometry.attributes.position.needsUpdate = true;

            // Ember pulse
            emberLight.intensity = 1.8 + Math.sin(idleTime * 3) * 0.4;

            // Golden wall pulsing slot #1
            const pulseOpacity = (Math.sin(idleTime * 2.5) * 0.5 + 0.5) * 0.8 + 0.2;
            pulseOverlayMat.opacity = pulseOpacity * 0.5;
            edgesLine.material.opacity = 0.5 + pulseOpacity * 0.5;

            renderer.render(scene, camera);
        }

        // ---------- RESIZE ----------
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
